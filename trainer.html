<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2f1" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#0f0a0d" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ETIB">
<title>ETIB PARFUM — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f2f1;--ink:#1a1215;--mute:#6b5f62;--line:#e0d3d2;--card:#fffdfc;--tint:#f0e6e5;--accent:#7a2e3f;--hl:#f2d6dc;--gold:#b8935a;
--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f0a0d;--ink:#f3eee6;--mute:#b3a6a8;--line:#33252b;--card:#171015;--tint:#1e151a;--accent:#e3a2b1;--hl:#4a2432}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 28px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{margin-top:auto}
.hd{display:flex;gap:14px;align-items:center;padding:32px 0 22px}
.mark{flex:none;width:52px;height:52px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:700 27px/1 var(--serif)}
h1{margin:0;font:700 23px/1.1 var(--serif);letter-spacing:.14em}
.hd small{display:block;margin-top:6px;color:var(--mute);font-size:14px}
a.tile{display:block;color:inherit;text-decoration:none;border-radius:var(--r-l,22px)}
a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a.hero{background:var(--accent);color:var(--paper);padding:30px 24px 24px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between}
.hero h2{margin:0;font:700 32px/1.1 var(--serif)}
.hero p{margin:10px 0 0;font-size:15px;opacity:.92;max-width:30ch}
.go{align-self:flex-start;margin-top:22px;font:700 14px var(--sans);padding:11px 20px;border-radius:var(--r-pill,999px);background:var(--paper);color:var(--ink)}
.list{display:grid;gap:10px;margin-top:12px}
a.row{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r-m,18px)}
.row h3{margin:0;font:700 18px/1.2 var(--serif)}
.row p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.row svg{flex:none;margin-left:auto;width:22px;height:22px;color:var(--accent)}
@media (hover:hover){.row:hover{background:var(--hl)}.hero:hover .go{background:var(--hl)}}
.foot{margin-top:26px;color:var(--mute);font-size:12.5px;text-align:center}
.adm-ico{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;color:var(--ink);text-decoration:none;font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.85;transition:opacity .15s}
.adm-ico[hidden]{display:none}
.adm-ico svg{width:40px;height:42px;display:block}
.adm-ico span{color:var(--mute)}
.adm-ico:hover{opacity:1}
.adm-ico:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.adm{margin-left:auto}

/* ---- стиль «стекло» ---- */
:root{--g-bg:rgba(255,255,255,.55);--g-bd:rgba(255,255,255,.9);--g-sh:0 8px 28px rgba(60,30,40,.14),inset 0 1px 0 rgba(255,255,255,.95);--g-bl:blur(18px) saturate(160%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:rgba(255,255,255,.07);--g-bd:rgba(255,255,255,.16);--g-sh:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--g-bg:rgba(255,255,255,.07);--g-bd:rgba(255,255,255,.16);--g-sh:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
body{background:radial-gradient(120% 60% at 50% -8%,rgba(176,86,108,.14) 0%,rgba(176,86,108,0) 62%) fixed no-repeat,linear-gradient(180deg,#fbf7f6 0%,#efe5e4 100%) fixed no-repeat;background-color:var(--paper)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(120% 60% at 50% -8%,#2b1620 0%,rgba(43,22,32,0) 62%) fixed no-repeat,linear-gradient(180deg,#130c10 0%,#0b070a 100%) fixed no-repeat;background-color:var(--paper)}}
:root[data-theme="dark"] body{background:radial-gradient(120% 60% at 50% -8%,#2b1620 0%,rgba(43,22,32,0) 62%) fixed no-repeat,linear-gradient(180deg,#130c10 0%,#0b070a 100%) fixed no-repeat;background-color:var(--paper)}
.mark,.adm-ico{background:var(--g-bg);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl)}
.adm-ico{width:50px;height:50px;padding:0;justify-content:center;border:1px solid var(--g-bd);border-radius:50%;opacity:1;color:var(--ink)}
.adm-ico span{display:none}
.adm-ico svg{width:33px;height:35px;stroke-width:1.5}
.adm-ico.home svg{width:27px;height:28px}
@media (max-width:380px){.adm-ico{width:44px;height:44px}.adm-ico svg{width:29px;height:31px}.adm-ico.home svg{width:24px;height:25px}}
a.row{background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl)}
a.hero{background:color-mix(in srgb,var(--accent) 90%,transparent);border:1px solid rgba(255,255,255,.35);box-shadow:0 12px 36px rgba(80,25,40,.35),inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
/* ---- логотип ---- */
.mark{border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:block;color:var(--ink)}
.mark svg{display:block;width:100%;height:100%}
/* ---- анимации ---- */
:root{--spring:cubic-bezier(.34,1.45,.5,1);--ease:cubic-bezier(.22,1,.36,1)}
@view-transition{navigation:auto}
::view-transition-group(root){animation-duration:.3s}
a,button,summary,.chip{-webkit-tap-highlight-color:transparent}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tabin{from{opacity:0;transform:translateX(var(--dx,0px)) scale(.985)}to{opacity:1;transform:none}}
@keyframes dlgin{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
a.tile,.btn,.chip,.tipbtn,.adm-ico,.seg button,.gtog,.gclr,.x,.zx,.card{transition:transform .38s var(--spring),background-color .25s,color .25s,box-shadow .25s,border-color .25s}
a.tile:active,.btn:active,.chip:active,.tipbtn:active,.adm-ico:active,.seg button:active,.gtog:active,.gclr:active,.x:active,.zx:active{transform:scale(.94);transition-duration:.1s}
summary:active{transform:scale(.99)}
dialog[open]{animation:dlgin .38s var(--ease) backwards}
dialog[open]::backdrop{animation:fadein .3s ease backwards}
.gbox:not([hidden]){animation:tabin .32s var(--ease) backwards}
section[id^="p-"]:not([hidden]){animation:tabin .42s var(--ease) backwards}
@media (max-width:699px){#dTip[open],#dFilters[open]{animation:sheetin .42s var(--ease) backwards}}
@media (hover:hover){a.tile:hover{transform:translateY(-2px)}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(60,30,40,.2)}}
}
/* плашка-стекло, которая перетекает */
.seg{position:relative}
.seg>button,.seg>.chip{position:relative;z-index:1}
.pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:var(--r-pill,999px);z-index:0;pointer-events:none;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:0 3px 12px rgba(60,30,40,.2),inset 0 1px 0 #fff;-webkit-backdrop-filter:blur(8px) saturate(160%);backdrop-filter:blur(8px) saturate(160%)}
@media (prefers-reduced-motion:no-preference){.pill{transition:left .5s var(--spring),width .5s var(--spring),background-color .4s,border-color .4s}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.3);box-shadow:0 3px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}}
@media (prefers-reduced-motion:no-preference){
.hd{animation:rise .5s var(--ease) backwards}
.list a.tile{animation:rise .55s var(--ease) backwards}
.list a.tile:nth-child(1){animation-delay:.07s}.list a.tile:nth-child(2){animation-delay:.14s}.list a.tile:nth-child(3){animation-delay:.21s}.list a.tile:nth-child(4){animation-delay:.28s}
a.hero{animation:rise .6s var(--ease) .35s backwards}
}

/* ---- стеклянные значки «Главная» и «Админ» ---- */
:root{--gi-a:#fff;--gi-ao:.85;--gi-bo:.05;--gl-bg1:rgba(255,255,255,.34);--gl-bg2:rgba(255,255,255,.06);--gl-bd:rgba(255,255,255,.85);--gl-sh:0 10px 26px rgba(70,35,45,.16),0 2px 6px rgba(70,35,45,.08);--gl-in:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1.5px 0 rgba(255,255,255,.35),inset 0 0 12px rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gi-a:#fff;--gi-ao:.26;--gi-bo:.05;--gl-bg1:rgba(255,255,255,.2);--gl-bg2:rgba(255,255,255,.04);--gl-bd:rgba(255,255,255,.28);--gl-sh:0 10px 26px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);--gl-in:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -1.5px 0 rgba(255,255,255,.08),inset 0 0 12px rgba(255,255,255,.08)}}
.hd .adm-ico,.adm-ico{background:linear-gradient(150deg,var(--gl-bg1),var(--gl-bg2));-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border:1px solid var(--gl-bd);box-shadow:var(--gl-sh),var(--gl-in);color:var(--ink)}
.adm-ico svg{filter:drop-shadow(0 1px 1px rgba(70,35,45,.12))}

/* ---- значки: один размер, по центру кружка ---- */
.adm-ico{display:flex;align-items:center;justify-content:center}
.adm-ico svg,.adm-ico.home svg{width:30px;height:34px;display:block;flex:none}
@media (max-width:380px){.adm-ico svg,.adm-ico.home svg{width:26px;height:29px}}
/* ---- значки «Главная» и «Админ»: плотнее, почти непрозрачные ---- */
:root{--gi-ao:1;--gi-bo:.22;--gl-bg1:#fffdfc;--gl-bg2:#ebdfdd;--gl-bd:#fff;--gl-sh:0 6px 16px rgba(70,35,45,.24),0 1px 3px rgba(70,35,45,.16);--gl-in:inset 0 1.5px 0 #fff,inset 0 -2px 5px rgba(110,70,80,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gi-ao:.6;--gi-bo:.14;--gl-bg1:#3a2a32;--gl-bg2:#241a20;--gl-bd:rgba(255,255,255,.32);--gl-sh:0 6px 16px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);--gl-in:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -2px 5px rgba(0,0,0,.35)}}
.adm-ico svg path,.adm-ico svg circle{stroke-opacity:.95}
.adm-ico svg [stroke="#fff"]{stroke-opacity:.9}

/* ---- тренажёр ---- */
main{margin-top:0}
.hd .home{margin-left:auto}.hd .adm{margin-left:0}
.panel{background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl);border-radius:var(--r-m,18px);padding:16px 18px;margin:12px 0}
.lvl h2{margin:0 0 2px;font:700 22px/1.2 var(--serif)}
.lvl p{margin:2px 0;color:var(--mute);font-size:13.5px}
.steps{display:flex;gap:6px;margin:12px 0 4px}
.steps i{flex:1;height:6px;border-radius:var(--r-pill,999px);background:var(--line)}
.steps i.on{background:var(--accent)}
.stat{display:flex;gap:18px;margin-top:10px;font-size:13px;color:var(--mute)}
.stat b{display:block;font:700 20px/1.1 var(--serif);color:var(--ink)}
h3.sec{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 4px 8px}
.modes{display:grid;gap:10px}
button.modebtn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r-m,18px);cursor:pointer;background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl)}
button.modebtn:focus-visible,.opt:focus-visible,.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.modebtn h4{margin:0;font:700 17px/1.2 var(--serif)}
.modebtn p{margin:2px 0 0;color:var(--mute);font-size:13px}
.modebtn svg{flex:none;margin-left:auto;width:20px;height:20px;color:var(--accent)}
.modebtn .pct{margin-left:auto;font:700 13px var(--sans);color:var(--accent)}
.modebtn.main{background:color-mix(in srgb,var(--accent) 90%,transparent);color:var(--paper);border-color:rgba(255,255,255,.35)}
.modebtn.main p{color:inherit;opacity:.9}.modebtn.main svg{color:inherit}
.modebtn[disabled]{opacity:.5;cursor:default}
.seg{display:flex;gap:2px;padding:3px;background:var(--tint);border-radius:var(--r-pill,999px);margin:6px 0 0}
.seg button{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:10px 2px;border-radius:var(--r-pill,999px);text-align:center;cursor:pointer;color:var(--mute);font:700 10.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
/* ---- как в каталоге: цвета разделов и перетекающая плашка ---- */
:root{--c-f:#b8315d;--c-m:#2a5d99;--c-u:#1b7253;--c-p:#7f5d0c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-f:#f09ab6;--c-m:#8ab8ee;--c-u:#7fd1ae;--c-p:#e0bb70}}
:root[data-theme="dark"]{--c-f:#f09ab6;--c-m:#8ab8ee;--c-u:#7fd1ae;--c-p:#e0bb70}
.seg{background:var(--g-bg);border:1px solid var(--g-bd);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl)}
#fseg button{position:relative;z-index:1}
#fseg button[data-v="ЖЕНСКИЕ"]{color:var(--c-f)}
#fseg button[data-v="МУЖСКИЕ"]{color:var(--c-m)}
#fseg button[data-v="УНИСЕКС"]{color:var(--c-u)}
#fseg button[data-v="ПРЕМИУМ"]{color:var(--c-p)}
#fseg button[aria-pressed=true]{background:transparent}
#fseg button[data-v=""][aria-pressed=true]{color:var(--ink)}
#fseg[data-sel="ЖЕНСКИЕ"] .pill{background:color-mix(in srgb,var(--c-f) 22%,rgba(255,255,255,.75));border-color:var(--c-f)}
#fseg[data-sel="МУЖСКИЕ"] .pill{background:color-mix(in srgb,var(--c-m) 22%,rgba(255,255,255,.75));border-color:var(--c-m)}
#fseg[data-sel="УНИСЕКС"] .pill{background:color-mix(in srgb,var(--c-u) 22%,rgba(255,255,255,.75));border-color:var(--c-u)}
#fseg[data-sel="ПРЕМИУМ"] .pill{background:color-mix(in srgb,var(--c-p) 24%,rgba(255,255,255,.75));border-color:var(--c-p)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #fseg[data-sel="ЖЕНСКИЕ"] .pill{background:color-mix(in srgb,var(--c-f) 32%,rgba(255,255,255,.08))}:root:not([data-theme="light"]) #fseg[data-sel="МУЖСКИЕ"] .pill{background:color-mix(in srgb,var(--c-m) 32%,rgba(255,255,255,.08))}:root:not([data-theme="light"]) #fseg[data-sel="УНИСЕКС"] .pill{background:color-mix(in srgb,var(--c-u) 32%,rgba(255,255,255,.08))}:root:not([data-theme="light"]) #fseg[data-sel="ПРЕМИУМ"] .pill{background:color-mix(in srgb,var(--c-p) 32%,rgba(255,255,255,.08))}}
.seg button:focus-visible{outline:3px solid var(--accent)}
.top{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
.nav{all:unset;cursor:pointer;font:700 13px var(--sans);color:var(--accent);padding:8px 4px}
.bar{flex:1;height:6px;border-radius:var(--r-pill,999px);background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill,999px);transition:width .35s}
.cnt{font:700 13px var(--sans);color:var(--mute)}
.wr{display:flex;flex-direction:column;gap:10px}
.wr input{width:100%;padding:14px 16px;border-radius:var(--r-m,18px);border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px/1.3 var(--sans)}
.wr input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.wmsg{margin:0;min-height:1.2em;font-size:13px;color:var(--mute)}
/* цвета уровней сложности */
:root{--d-e:#1b7253;--d-h:#9a5b00;--d-x:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--d-e:#7fd1ae;--d-h:#f0b45a;--d-x:#ff8a80}}
:root[data-theme="dark"]{--d-e:#7fd1ae;--d-h:#f0b45a;--d-x:#ff8a80}
#dseg button{position:relative;z-index:1}
#dseg button[data-v="e"]{color:var(--d-e)}
#dseg button[data-v="h"]{color:var(--d-h)}
#dseg button[data-v="x"]{color:var(--d-x)}
#dseg button[aria-pressed=true]{background:transparent;text-shadow:0 0 .5px currentColor}
#dseg[data-sel="e"] .pill{background:color-mix(in srgb,var(--d-e) 22%,rgba(255,255,255,.75));border-color:var(--d-e)}
#dseg[data-sel="h"] .pill{background:color-mix(in srgb,var(--d-h) 22%,rgba(255,255,255,.75));border-color:var(--d-h)}
#dseg[data-sel="x"] .pill{background:color-mix(in srgb,var(--d-x) 22%,rgba(255,255,255,.75));border-color:var(--d-x)}
:root:not([data-theme="light"]) #dseg[data-sel="e"] .pill{background:color-mix(in srgb,var(--d-e) 32%,rgba(255,255,255,.08))}
:root:not([data-theme="light"]) #dseg[data-sel="h"] .pill{background:color-mix(in srgb,var(--d-h) 32%,rgba(255,255,255,.08))}
:root:not([data-theme="light"]) #dseg[data-sel="x"] .pill{background:color-mix(in srgb,var(--d-x) 32%,rgba(255,255,255,.08))}
#dseg[data-sel="e"]+.ddesc{border-left:3px solid var(--d-e)}
#dseg[data-sel="h"]+.ddesc{border-left:3px solid var(--d-h)}
#dseg[data-sel="x"]+.ddesc{border-left:3px solid var(--d-x)}
.ddesc{padding-left:10px}
.ddesc{margin:8px 4px 0;font-size:13px;line-height:1.45;color:var(--mute)}
.tmr{height:4px;border-radius:var(--r-pill,999px);background:var(--line);overflow:hidden;margin:-2px 0 10px}
.tmr i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:tmr linear forwards}
@keyframes tmr{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.q small{display:block;margin-bottom:6px;font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.q h2{margin:0;font:700 21px/1.3 var(--serif)}
.q .nt{margin:8px 0 0;padding:0;list-style:none}
.q .nt li{margin:5px 0;font-size:16px}.q .nt b{color:var(--accent)}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{all:unset;box-sizing:border-box;width:100%;padding:15px 16px;border-radius:var(--r-m,18px);cursor:pointer;font:600 15.5px/1.35 var(--sans);background:var(--g-bg);border:1.5px solid var(--g-bd);box-shadow:var(--g-sh);-webkit-backdrop-filter:var(--g-bl);backdrop-filter:var(--g-bl);display:flex;gap:10px;align-items:center}
.opt .mk{margin-left:auto;font-weight:700;flex:none}

const $=s=>document.querySelector(s);
const CATL={ЖЕНСКИЕ:'Женские',МУЖСКИЕ:'Мужские',УНИСЕКС:'Унисекс',ПРЕМИУМ:'Премиум'};
const A=window.TR.map(x=>Object.assign({},x,{key:x.c+'|'+x.n,all:[].concat(x.top,x.heart,x.base)}));
const NC={};A.forEach(a=>NC[a.nm]=(NC[a.nm]||0)+1);
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GEN=/^(мускус|белый мускус|амбра|серая амбра|древесные ноты|сладкие ноты|цветочные ноты|водные ноты|морские ноты|зеленые ноты|зелёные ноты|минеральные ноты|минеральные примечания|специи|цитрусы|смолы|фруктовые ноты|ароматные специи)$/i;
const spec=n=>!GEN.test(n)&&!/[a-zA-Z]/.test(n);
const stems=n=>n.toLowerCase().replace(/ё/g,'е').split(/[\s-]+/).filter(w=>w.length>3).map(w=>w.slice(0,5));
const hasNote=(a,n)=>{const s=stems(n);return a.all.some(m=>stems(m).some(x=>s.includes(x)))};
const pyr=a=>[['В начале',a.top],['В сердце',a.heart],['В основе',a.base]].filter(r=>r[1].length).map(r=>`<b>${r[0]}:</b> ${r[1].map(esc).join(', ')}`).join('<br>');
const card=a=>`<b>${esc(a.n)} ${esc(a.nm)}</b><br>${pyr(a)}`;
const NOTES={ваниль:/ванил/,пачули:/пачул/,жасмин:/жасмин/,роза:/(^|\s)роз(а|ы)(\s|$)/,бергамот:/бергамот/,кедр:/кедр/,сандал:/сандал/,пион:/пион/,лимон:/лимон/,мята:/мят/,кофе:/кофе/,пралине:/пралин/,груша:/груш/,яблоко:/яблок/,лаванда:/лаванд/,апельсин:/(^|\s)апельсин(\s|$)/,грейпфрут:/грейпфрут/,имбирь:/имбир/,кардамон:/кардамон/,ананас:/ананас/,малина:/малин/,персик:/персик/,ирис:/ирис/,гелиотроп:/гелиотроп/,какао:/какао/,'бобы тонка':/тонка/};
const hasRx=(a,rx)=>a.all.some(m=>rx.test(m.toLowerCase()));
let FILT='all';
const poolOf=()=>A.filter(a=>FILT==='all'||a.c===FILT);
/* ---- уровни сложности ---- */
const DIFFS=[
 {id:'e',t:'Обычный',d:'4 варианта ответа, случайные ароматы в вариантах, три ноты в подсказке.',w:3,time:0,clues:3,sim:false},
 {id:'h',t:'Сложный',d:'5 вариантов, среди них похожие ароматы: тот же тип, общие ноты, тот же бренд.',w:4,time:0,clues:3,sim:true},
 {id:'x',t:'Эксперт',d:'5 вариантов с похожими ароматами. В «Угадай по нотам» даны две ноты, ответ пишешь сам: подойдёт любой аромат с этими нотами. 20 секунд на выбор ответа, 45 на письменный.',w:4,time:20,clues:2,sim:true,write:true}];
let DIFF='e';try{const v=localStorage.getItem('etib-diff');if(DIFFS.some(d=>d.id===v))DIFF=v}catch(e){}
const DF=()=>DIFFS.find(d=>d.id===DIFF);
const TM=q=>DF().time?(q.tm||DF().time):0;
const SIMC={};
const simSet=a=>SIMC[a.key]||(SIMC[a.key]=new Set(a.all.filter(spec).flatMap(stems)));
const brand=a=>a.nm.toLowerCase().split(' ')[0];
const simScore=(a,b)=>{let s=0;const x=simSet(a);simSet(b).forEach(k=>{if(x.has(k))s++});return s+(a.t===b.t?2:0)+(brand(a)===brand(b)?3:0)};
function distract(a,n,ok){let p=shuf(A.filter(b=>b.c===a.c&&b.key!==a.key&&b.nm!==a.nm&&(!ok||ok(b))));
 {const u=new Set();p=p.filter(b=>!u.has(b.nm)&&u.add(b.nm))}
 if(DF().sim)p=shuf(p.sort((x,y)=>simScore(a,y)-simScore(a,x)).slice(0,Math.max(n*3,n)));
 return p.slice(0,n)}
function opts(correct,wrong){return shuf([{t:correct,ok:true}].concat(wrong.map(t=>({t,ok:false}))))}

function glassPill(box){

 function go(){
  const b=cur();if(!b){p.style.opacity=0;return}
  const changed=last!==null&&last!==b;p.style.opacity=1;
  if(last===null)p.style.transition='none';
  p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px';box.dataset.sel=b.dataset.v||'';
  if(last===null){void p.offsetWidth;p.style.transition=''}

const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

function stkHTML(b){return `<span class="stk${S.s>1?' on':''}${b?' bump':''}" id="stk" role="status" aria-label="Серия правильных ответов: ${S.s}">${FLAME}${S.s}</span>`}
function ringsHTML(){const t={},g={};A.forEach(a=>{t[a.c]=(t[a.c]||0)+1;if(S.k[a.key])g[a.c]=(g[a.c]||0)+1});

  return `<button type="button" class="ring" data-f="${c}" aria-pressed="${FILT===c}" aria-label="${CATL[c]}: освоено ${n} из ${t[c]||0}"><span class="rg"><svg viewBox="0 0 56 56" aria-hidden="true"><circle class="tr" cx="28" cy="28" r="23" pathLength="100"/><circle class="pg" cx="28" cy="28" r="23" pathLength="100" stroke-dasharray="${p} 100"/></svg><b>${p}%</b></span>${l}<small>${n}/${t[c]||0}</small></button>`}).join('')}</div>`}
function makeQ(mode){
 for(let i=0;i<40;i++){
  let g,a=null;

  if(g==='sit'){const q=GEN_Q.sit();if(q){q.g='sit';return q}continue}
  if(g==='know'){const q=GEN_Q.know();if(q){q.g='know';return q}continue}
  if(g==='facts'){const q=GEN_Q.facts();if(q){q.g='facts';return q}continue}
  if(g==='obj'){const q=GEN_Q.obj();if(q){q.g='obj';return q}continue}
  let pool=poolOf();

  if(!pool.length)pool=A;
  a=pick(pool);const q=GEN_Q[g](a);
  if(q&&!R.seen.has(q.a.key+g)){R.seen.add(q.a.key+g);q.g=g;return q}

}
function start(mode){
 R={mode,d:DIFF,i:0,ok:0,seen:new Set(),wrong:[],log:[],q:null,done:false,tm:0};next();

 ${q.write?`<div class="wr"><input id="wi" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Номер или название, например A5" aria-label="Твой ответ"><button class="go2" id="wgo" type="button">Проверить</button><button class="go2 sec" id="wsk" type="button">Не помню</button><p class="wmsg" id="wmsg" role="status"></p></div>`:`<div class="opts" role="group" aria-label="Варианты ответа">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span>${esc(o.t)}</span><span class="mk"></span></button>`).join('')}</div>`}
 <div id="fb" aria-live="polite"></div>`;

 if(q.write){const wi=$('#wi');$('#wgo').onclick=()=>answerW(wi.value);$('#wsk').onclick=()=>answerW('',true);wi.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();answerW(wi.value)}};try{wi.focus({preventScroll:true})}catch(e){}}

/* ---- письменный ответ (Эксперт, «Угадай по нотам») ---- */
const HOM={'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X'};
const nrm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');
const codeOf=s=>String(s).toUpperCase().replace(/\s+/g,'').replace(/[АВСЕНКМОРТХ]/g,c=>HOM[c]);
function findAroma(t){

 if(ok){S.c++;mm.c++;R.ok++;S.s++;if(S.s>S.bs)S.bs=S.s;S.k[m.key]=1;if(R.mode==='fix'&&S.w[q.a.key]){S.w[q.a.key]--;if(S.w[q.a.key]<=0)delete S.w[q.a.key]}}

 {const sk=$('#stk');if(sk)sk.outerHTML=stkHTML(ok&&S.s>1)}$('#nx').onclick=next;$('#nx').focus({preventScroll:true});$('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
const getNm=()=>{try{return localStorage.getItem('etib-name')||''}catch(e){return ''}},setNm=v=>{try{localStorage.setItem('etib-name',v)}catch(e){}};
